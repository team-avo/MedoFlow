# Render Blueprint: MedoFlow backend (Express + Prisma + BullMQ)
# https://render.com/docs/blueprint-spec
#
# Deploys are driven by GitHub Actions (.github/workflows/deploy.yml): CI builds and
# typechecks first, then calls this service's Deploy Hook with the exact commit SHA.
# Auto-deploy is therefore OFF so a failing build can never reach production.
# The service must be connected to team-avo/MedoFlow, branch `development`, so the
# hook's ?ref=<sha> resolves to a commit in that repo.
#
# The frontend is NOT on Render, it is deployed to Cloudflare Workers by the same workflow.

services:
  - type: web
    name: medoflow-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Keep the database close: every query is a round trip, and a booking makes
    # ~20 inside one transaction. The demo database is Aiven (DigitalOcean, San
    # Francisco, ~50 ms RTT from Ohio). It was Neon us-east-2 until 2026-11; a
    # Singapore database (~230 ms RTT) made bookings time out.
    region: ohio
    # Choose a paid instance for anything beyond a demo: the free tier sleeps after
    # 15 min idle, which pauses node-cron jobs and the BullMQ (AI scribe) worker.
    plan: 0.5c-512mb
    healthCheckPath: /api/v1/health
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_ENV
        value: production
      # B0.1.1: production refuses to boot unless isolation is enforcing.
      - key: TENANT_ISOLATION_MODE
        value: enforce
      # B0.2.3: server-side idle logoff window.
      - key: SESSION_IDLE_TIMEOUT_MINUTES
        value: '15'
      # F0.2.3: refresh cookie SameSite. 'none' (Secure + Partitioned, CSRF header
      # required) while app and API are on different sites; switch to 'strict'
      # once both share a domain (B0.6.9).
      - key: REFRESH_COOKIE_SAMESITE
        value: none
      # B0.3.6: audit rows are kept at least 6 years.
      - key: AUDIT_RETENTION_YEARS
        value: '6'
      # WS4: the hosted demo shows plans for display only, every clinic is
      # ACTIVE with the top limits and nothing expires (config/billingMode.ts).
      # Remove (or set to trial) for a real deployment.
      - key: BILLING_MODE
        value: demo
      # Clinic onboarding: on the demo a submitted clinic application is
      # approved at once (config/clinicReview.ts). Remove (or set to manual)
      # for a real deployment so a platform admin verifies every clinic.
      - key: CLINIC_REVIEW_MODE
        value: auto
      # CTO-10: the "retype your clinic name" step before submitting the
      # agreement is an anti-spam check for the demo only. Unset (or off) in
      # production (config/clinicReview.ts).
      - key: ONBOARDING_CONFIRM_NAME
        value: 'on'
      # Frontend origin(s) allowed by CORS (comma-separated).
      # Component 8 cut-over (arh-agent-docs/cloudflare-custom-domains-setup-guide.md):
      # once app.<root> / api.<root> / *.<root> are live, set
      #   CORS_ORIGIN=https://app.<root>,https://*.<root>   (verified custom domains are
      #   allowed automatically)  FRONTEND_URL/APP_URL=https://app.<root>
      #   BACKEND_URL=https://api.<root>  SITE_ROOT_DOMAIN=<root>  APP_HOSTS=app.<root>
      #   SITE_CNAME_TARGET=sites.<root>  SITE_PREVIEW_SECRET (secret)
      #   SITE_ASSETS_BUCKET / SITE_ASSETS_PUBLIC_BASE_URL  (public R2 bucket)
      #   DOMAIN_PROVIDER=cloudflare + CF_API_TOKEN / CF_ZONE_ID (secrets)
      #   TRUST_PROXY=2 if api.<root> is proxied (orange cloud), else 1
      - key: CORS_ORIGIN
        value: https://medoflow-web.advertout-medoflow.workers.dev
      - key: FRONTEND_URL
        value: https://medoflow-web.advertout-medoflow.workers.dev
      - key: APP_URL
        value: https://medoflow-web.advertout-medoflow.workers.dev
      - key: JWT_SECRET
        generateValue: true
      # ── Secrets: prompted once when the Blueprint is created ──────────────────
      # B0.1.3: the app connects as medoflow_app (non-owner, NOBYPASSRLS) so RLS applies;
      # migrations run as the owner (Aiven: avnadmin). Direct URLs, no PgBouncer.
      # DATABASE_URL: add &connection_limit=10&pool_timeout=20, well under the
      # plan's max_connections.
      - key: DATABASE_URL # postgresql://medoflow_app:…@…/defaultdb?sslmode=require&connection_limit=10&pool_timeout=20
        sync: false
      - key: MIGRATION_DATABASE_URL # postgresql://avnadmin:…@… (owner; migrations only)
        sync: false
      - key: AUDIT_PURGE_DATABASE_URL # owner URL; audit retention purge (rows > 6 years)
        sync: false
      - key: MFA_ENCRYPTION_KEY # B0.2.2: openssl rand -hex 32
        sync: false
      # B3.2 field-level encryption: required in production (boot refuses without it).
      - key: FIELD_ENCRYPTION_KEYS # k1:<openssl rand -hex 32>; then run ops:encrypt-phi
        sync: false
      - key: FIELD_ENCRYPTION_ACTIVE_KID
        value: k1
      - key: ALERT_WEBHOOK_URL # B0.6.5: Slack-compatible incoming webhook for security alerts
        sync: false
      - key: REDIS_URL # Upstash rediss:// URL (eviction must be off / noeviction)
        sync: false
      # BullMQ idle polling (queues/redisConnection.ts). Defaults keep both idle
      # workers near 1.7k Redis commands a day, well inside a free tier. Lower
      # values cost commands; only set these to raise them or to fit a provider
      # that cuts blocking calls short.
      # - key: BULLMQ_DRAIN_DELAY_SECONDS   # default 300
      # - key: BULLMQ_STALLED_INTERVAL_MS   # default 300000
      - key: GROQ_API_KEY # AI front desk (voice agent); optional
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Video consultations (8x8 JaaS). Unset = video calls disabled. With them
      # set, production boot also needs VIDEO_PHI_POLICY: "baa-signed" once the
      # 8x8 BAA is signed, or "synthetic-data-only" for test environments.
      - key: JAAS_APP_ID # vpaas-magic-cookie-…
        sync: false
      - key: JAAS_KID # API Key ID, "<AppID>/<id>"
        sync: false
      - key: JAAS_PRIVATE_KEY # PEM on one line, newlines written as \n
        sync: false
      - key: VIDEO_PHI_POLICY
        sync: false
      # R2 (S3-compatible) file storage: required in production (B3.1: patient
      # files are only reached through presigned URLs; boot refuses local disk).
      - key: S3_SSE # R2 always encrypts at rest and rejects the SSE header
        value: provider-default
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        value: medoflow-files
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        value: https://523c0186a1808be62e718907053c513b.r2.cloudflarestorage.com
