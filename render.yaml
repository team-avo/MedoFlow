# Render Blueprint — MedoFlow backend (Express + Prisma + BullMQ)
# https://render.com/docs/blueprint-spec
#
# Deploys are driven by GitHub Actions (.github/workflows/deploy.yml): CI builds and
# typechecks first, then calls this service's Deploy Hook with the exact commit SHA.
# Auto-deploy is therefore OFF so a failing build can never reach production.
# The service must be connected to team-avo/MedoFlow, branch `development`, so the
# hook's ?ref=<sha> resolves to a commit in that repo.
#
# The frontend is NOT on Render — it is deployed to Cloudflare Workers by the same workflow.

services:
  - type: web
    name: medoflow-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Same AWS region as the Neon database (us-east-2).
    region: ohio
    # Choose a paid instance for anything beyond a demo: the free tier sleeps after
    # 15 min idle, which pauses node-cron jobs and the BullMQ (AI scribe) worker.
    plan: 0.5c-512mb
    healthCheckPath: /api/v1/health
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_ENV
        value: production
      # B0.1.1: production refuses to boot unless isolation is enforcing.
      - key: TENANT_ISOLATION_MODE
        value: enforce
      # B0.2.3: server-side idle logoff window.
      - key: SESSION_IDLE_TIMEOUT_MINUTES
        value: '15'
      # F0.2.3: refresh cookie SameSite. 'none' (Secure + Partitioned, CSRF header
      # required) while app and API are on different sites; switch to 'strict'
      # once both share a domain (B0.6.9).
      - key: REFRESH_COOKIE_SAMESITE
        value: none
      # B0.3.6: audit rows are kept at least 6 years.
      - key: AUDIT_RETENTION_YEARS
        value: '6'
      # Frontend origin(s) allowed by CORS (comma-separated).
      - key: CORS_ORIGIN
        value: https://medoflow-web.advertout-medoflow.workers.dev
      - key: FRONTEND_URL
        value: https://medoflow-web.advertout-medoflow.workers.dev
      - key: APP_URL
        value: https://medoflow-web.advertout-medoflow.workers.dev
      - key: JWT_SECRET
        generateValue: true
      # ── Secrets: prompted once when the Blueprint is created ──────────────────
      # B0.1.3: the app connects as medoflow_app (non-owner, NOBYPASSRLS) so RLS applies;
      # migrations run as the owner. Both are Neon *direct* (non-pooler) URLs.
      - key: DATABASE_URL # postgresql://medoflow_app:…@…/medoflow-demo-db?sslmode=require
        sync: false
      - key: MIGRATION_DATABASE_URL # postgresql://neondb_owner:…@… (owner; migrations only)
        sync: false
      - key: AUDIT_PURGE_DATABASE_URL # owner URL; audit retention purge (rows > 6 years)
        sync: false
      - key: MFA_ENCRYPTION_KEY # B0.2.2: openssl rand -hex 32
        sync: false
      # B3.2 field-level encryption — required in production (boot refuses without it).
      - key: FIELD_ENCRYPTION_KEYS # k1:<openssl rand -hex 32>; then run ops:encrypt-phi
        sync: false
      - key: FIELD_ENCRYPTION_ACTIVE_KID
        value: k1
      - key: ALERT_WEBHOOK_URL # B0.6.5: Slack-compatible incoming webhook for security alerts
        sync: false
      - key: REDIS_URL # redis:// or rediss:// (eviction policy must be noeviction)
        sync: false
      - key: GROQ_API_KEY # AI front desk (voice agent); optional
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # R2 (S3-compatible) file storage — required in production (B3.1: patient
      # files are only reached through presigned URLs; boot refuses local disk).
      - key: S3_SSE # R2 always encrypts at rest and rejects the SSE header
        value: provider-default
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        value: medoflow-files
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        value: https://523c0186a1808be62e718907053c513b.r2.cloudflarestorage.com
