# CI/CD for MedoFlow
#
#   pull request → development   quality gate + build gate (no secrets, no deploy)
#   push / merge → development   quality gate + build gate → build + deploy frontend to Cloudflare Workers
#                                (only when frontend files changed) → smoke check
#   manual run                   Actions › "CI / Deploy" › Run workflow (deploys the frontend)
#
# The backend is deployed by Render itself (auto-deploy from team-avo/MedoFlow `development`).
# The CI deploy-backend job below is commented out; re-enable it (and turn Render
# auto-deploy off) to deploy only commits that passed the gates.
#
# Deploys only run in team-avo/MedoFlow (default branch `development`). Forks run the gates only.
#
# B0.5.1 / F0.1.2: make "Backend quality gate", "Frontend quality gate" and "Build"
# REQUIRED status checks on development
# (Settings › Branches › Branch protection) so a failing check blocks the merge.
#
# Deploy settings live in the GitHub environment `medoflow-dev-env`
# (Settings › Environments › medoflow-dev-env), not at repository level.
# Secrets:
#   CLOUDFLARE_API_TOKEN     Cloudflare token with Workers Scripts: Edit
#   CLOUDFLARE_ACCOUNT_ID    523c0186a1808be62e718907053c513b
#   RENDER_DEPLOY_HOOK_URL   only if deploy-backend is re-enabled (Render › medoflow-backend › Settings › Deploy Hook)
# Variables:
#   BACKEND_URL                          e.g. https://medoflow-backend.onrender.com (no trailing slash)
#   FRONTEND_URL                         https://medoflow-web.advertout-medoflow.workers.dev
#   NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY   optional, pk_test_… / pk_live_…
name: CI / Deploy

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'deploy-development' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'
  DEPLOY_REPO: team-avo/MedoFlow

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'render.yaml'
            frontend:
              - 'frontend/**'
              - 'pnpm-lock.yaml'
              - 'package.json'

  # B0.5 — blocking backend quality gate: typecheck, lint (zero warnings),
  # synthetic-fixture scan, unit tests + coverage ratchet, migrations on a
  # fresh Postgres, integration suites (tenant isolation, RLS, auth
  # safeguards, authZ matrix, booking race + overlap constraint (B1), invoice
  # states, webhook idempotency, audit) as the non-owner app role, dependency
  # audit, secret scan.
  backend-quality:
    name: Backend quality gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medoflow_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OWNER_URL: postgresql://postgres:postgres@localhost:5432/medoflow_ci
      APP_URL: postgresql://medoflow_app:ci_app_password@localhost:5432/medoflow_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm exec prisma generate
      - name: Typecheck (app + tests)
        run: pnpm run typecheck
      - name: Lint (zero warnings)
        run: pnpm run lint
      - name: Fixtures are synthetic only (B0.5.5)
        run: node scripts/check-synthetic-fixtures.js
      - name: Unit tests + coverage threshold (B0.5.2)
        run: pnpm run test:coverage
      - name: Migrations apply cleanly to an empty database
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
        run: pnpm exec prisma migrate deploy
      - name: Enable the non-owner app role (RLS applies to it)
        run: psql "$OWNER_URL" -c "ALTER ROLE medoflow_app WITH LOGIN PASSWORD 'ci_app_password'"
      - name: Integration suites + coverage threshold (B0.1.5, B0.5.3)
        env:
          INTEGRATION_DATABASE_URL: ${{ env.APP_URL }}
          INTEGRATION_ADMIN_DATABASE_URL: ${{ env.OWNER_URL }}
        run: pnpm run test:integration:coverage
      - name: Dependency audit — no high/critical in backend production deps
        # Frontend advisories are tracked under F0.1; accepted, dated exceptions
        # live in backend/scripts/audit-exceptions.json.
        run: node scripts/audit-backend.js
      - name: Secret scan (git history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # F0.1 / F0.4 — blocking frontend quality gate: typecheck, lint (zero
  # warnings, no-console), unit + component tests with coverage ratchet
  # (refresh interceptor, role guards, PHI boundary, no-PHI-in-URL / telemetry
  # guards), dependency audit, production build (type errors fail it), and
  # browser e2e (idle logoff, MFA enrol + challenge, scheduling flows F1.1–F1.3,
  # axe a11y scan).
  frontend-quality:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint (zero warnings)
        run: pnpm run lint
      - name: Unit + component tests + coverage threshold (F0.4)
        run: pnpm run test:coverage
      - name: Dependency audit — no high/critical in frontend production deps
        run: node scripts/audit-frontend.js
      - name: Production build (a type error fails it — F0.1.1)
        env:
          # e2e build: the API is simulated in the browser (e2e/mockApi.ts).
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3999
        run: pnpm exec next build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser e2e (F0.2 idle logoff + MFA, F1 booking / waitlist / recurring / cancel-reschedule, F3 presigned files)
        env:
          E2E_SKIP_BUILD: '1'
        run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Backend — prisma generate, typecheck, build
        working-directory: backend
        run: |
          pnpm exec prisma generate
          pnpm run typecheck
          pnpm run build

      - name: Backend — Docker image builds (what Render runs)
        run: docker build -t medoflow-backend:ci backend

      # Build gate only. This job has no environment, so it cannot see the
      # medoflow-dev-env values; deploy-frontend rebuilds with the real API URL.
      - name: Frontend — OpenNext build for Cloudflare Workers
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: pnpm run cf:build

  # deploy-backend:
  #   needs: [changes, backend-quality, frontend-quality, build]
  #   if: >-
  #     github.repository == 'team-avo/MedoFlow' && github.event_name != 'pull_request' &&
  #     (needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch')
  #   runs-on: ubuntu-latest
  #   environment: production
  #   steps:
  #     - name: Trigger Render deploy of this exact commit
  #       env:
  #         HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
  #       run: |
  #         test -n "$HOOK" || { echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set"; exit 1; }
  #         curl -fsS -X POST "${HOOK}&ref=${GITHUB_SHA}"
  #     - name: Wait until Render serves this commit
  #       env:
  #         BACKEND_URL: ${{ vars.BACKEND_URL }}
  #       run: |
  #         test -n "$BACKEND_URL" || { echo "::error::BACKEND_URL variable is not set"; exit 1; }
  #         # Docker build + migrate + boot usually takes 3–8 minutes.
  #         for i in $(seq 1 90); do
  #           commit=$(curl -fsS "$BACKEND_URL/api/v1/health" | jq -r '.data.commit // empty' || true)
  #           if [ "$commit" = "$GITHUB_SHA" ]; then echo "Render is serving $GITHUB_SHA"; exit 0; fi
  #           echo "[$i] live commit: ${commit:-unknown}; waiting…"; sleep 10
  #         done
  #         echo "::error::Render did not start serving $GITHUB_SHA within 15 minutes — check the Render deploy logs"
  #         exit 1

  deploy-frontend:
    needs: [changes, backend-quality, frontend-quality, build]
    if: >-
      github.repository == 'team-avo/MedoFlow' && github.event_name != 'pull_request' &&
      (needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: medoflow-dev-env
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refuse to ship a bundle without the real API URL
        run: test -n "${{ vars.BACKEND_URL }}" || { echo "::error::BACKEND_URL variable is not set"; exit 1; }
      - name: OpenNext build for Cloudflare Workers
        working-directory: frontend
        env:
          # Public, build-time values (inlined into the browser bundle).
          NEXT_PUBLIC_API_URL: ${{ vars.BACKEND_URL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: pnpm run cf:build
      - name: Deploy to Cloudflare Workers
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Deploy the bundle built above as-is (otherwise wrangler hands off to `opennextjs-cloudflare deploy`).
          OPEN_NEXT_DEPLOY: 'true'
        run: pnpm exec wrangler deploy --message "${GITHUB_SHA::7} via GitHub Actions"
      - name: Smoke check
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://medoflow-web.advertout-medoflow.workers.dev' }}
        run: |
          for path in / /login /dashboard; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$FRONTEND_URL$path")
            echo "$path → $code"; [ "$code" -lt 400 ] || exit 1
          done
